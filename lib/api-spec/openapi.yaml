openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/account:
    delete:
      operationId: deleteAccount
      summary: Delete the authenticated account
      description: Apple-linked accounts require fresh native Apple credentials so authorization can be revoked before data deletion.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionInput"
      responses:
        "200":
          description: Account deleted
        "400":
          description: Fresh Apple confirmation required
        "401":
          description: Not authenticated
        "403":
          description: Apple identity does not match
        "502":
          description: Apple authorization could not be revoked
        "503":
          description: Apple revocation signing credentials are not configured
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AccountDeletionInput:
      type: object
      properties:
        identityToken:
          type: string
          minLength: 1
          maxLength: 10000
          writeOnly: true
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 10000
          writeOnly: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

